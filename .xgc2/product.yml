schema: xgc2.product.v1
id: xgc2-gazebo-sim-vrpn-bridge
name: XGC2 Gazebo Sim VRPN Bridge
version: 1.1.0-23
kind: ros1-apt
summary: In-process Gazebo Classic pose to VRPN server with a legacy ROS fallback.
ros:
  distro: noetic
  packages:
  - gazebo_sim_vrpn_bridge
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-gazebo-sim-vrpn-bridge
  packages:
  - ros-noetic-xgc2-gazebo-sim-vrpn-bridge
  depends:
  - libxgc2-math-dev (>= 0.5.6-6~focal)
  - ros-noetic-gazebo-ros
  - ros-noetic-gazebo-msgs
  - ros-noetic-geometry-msgs
  - ros-noetic-roscpp
  - ros-noetic-tf2
  - ros-noetic-tf2-ros
  - ros-noetic-vrpn
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-gazebo-sim-vrpn-bridge

    '
  smoke_test: 'roslaunch --files gazebo_sim_vrpn_bridge vrpn_server.launch auto_track_known_models:=true

    '
ownership:
  paths:
  - /opt/ros/noetic/share/gazebo_sim_vrpn_bridge
  - /opt/ros/noetic/include/gazebo_sim_vrpn_bridge
  - /opt/ros/noetic/lib/gazebo_sim_vrpn_bridge
  - /opt/ros/noetic/lib/libgazebo_sim_vrpn_server_core.so
  - /opt/ros/noetic/lib/libgazebo_sim_vrpn_system_plugin.so
release:
  dependency_policy:
    libxgc2-math-dev: rebuild
  apt_versions:
    focal: 1.1.0-23
