# Complex explicit delay experiment config. Common and per-tracker components
# are added, then clamped to each tracker's max_delay_ms or the global limit.

model_states_topic: /gazebo/model_states
bind_address: ""
port: 3883
publish_rate: 120.0
scan_interval: 2.0
stale_timeout: 1.0
velocity_filter_cutoff: 25.0
acceleration_filter_cutoff: 25.0
derivative_reset_timeout: 0.5
match_mode: contains
auto_track_known_models: false

mocap_noise:
  enabled: true
  position_stddev_xyz: [1.0e-7, 1.0e-7, 1.0e-7]
  rotation_stddev_rpy: [0.0, 0.0, 0.0]
  seed: 1

delay:
  enabled: true
  timestamp_policy: sample_time
  seed: 42
  max_delay_ms: 30.0
  history_margin_ms: 20.0
  common:
    base_ms: 5.0
    slow_stddev_ms: 3.0
    slow_tau_s: 5.0
    jitter_stddev_ms: 1.0
    burst_probability: 0.001
    burst_extra_ms: [8.0, 20.0]
  trackers:
    uav1:
      base_ms: 8.0
      slow_stddev_ms: 3.0
      slow_tau_s: 4.0
      jitter_stddev_ms: 2.0
      burst_probability: 0.002
      burst_extra_ms: [5.0, 15.0]
      max_delay_ms: 30.0
    ugv1:
      base_ms: 12.0
      slow_stddev_ms: 2.0
      slow_tau_s: 8.0
      jitter_stddev_ms: 1.5
      burst_probability: 0.001
      burst_extra_ms: [5.0, 12.0]
      max_delay_ms: 30.0

trackers: []

auto_mapping:
  enabled: false
  include_patterns:
    - "^uav[0-9]+$"
    - "^ugv[0-9]+$"

manual_mapping: {}

default_body_to_tracker:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

extrinsics: {}
robots: {}
